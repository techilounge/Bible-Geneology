<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="crest-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="120" height="120" rx="28" fill="#131b26"/>
  <rect x="1" y="1" width="118" height="118" rx="27" stroke="#334155" stroke-width="1.5"/>
  <circle cx="60" cy="60" r="50" fill="url(#halo)"/>

  <!-- Stylized central trunk and genealogical branches -->
  <path d="M60 22v76" stroke="url(#crest-glow)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M60 42c16-16 28-8 32-2" stroke="url(#crest-glow)" stroke-width="3.5" stroke-linecap="round"/>
