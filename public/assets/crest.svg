  <path d="M60 78c14-10 24-4 28 2" stroke="url(#crest-glow)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Golden Nodes -->
  <circle cx="92" cy="40" r="5.5" fill="#f59e0b"/>
  <circle cx="28" cy="60" r="5.5" fill="#f59e0b"/>
  <circle cx="88" cy="80" r="5" fill="#f59e0b"/>
  <circle cx="60" cy="22" r="5" fill="#fcd34d"/>
  <circle cx="60" cy="98" r="6" fill="#f59e0b"/>
